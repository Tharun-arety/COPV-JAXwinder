[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copv_opt"
version = "0.1.0"
description = "Differentiable winding-first design screening for Composite Overwrapped Pressure Vessels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "jaxlib",
    "jaxopt",
    "gmsh",
    "meshio",
    "numpy",
    "scipy",
    "pyvista",
    "matplotlib",
    "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]

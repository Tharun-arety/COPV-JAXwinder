[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copv_opt"
version = "0.2.0"
description = "Differentiable winding-first design screening for Composite Overwrapped Pressure Vessels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax~=0.6",
    "jaxlib~=0.6",
    "jaxopt>=0.8",
    "gmsh>=4.11,<5",
    "meshio>=5.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyvista>=0.43",
    "matplotlib>=3.7",
    "Pillow>=9.0",
]

[project.optional-dependencies]
# Phase 0 configurator web app (trame). Install with:  pip install -e .[app]
app = [
    "trame>=3.6",
    "trame-vuetify>=2.7",
    "trame-vtk>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

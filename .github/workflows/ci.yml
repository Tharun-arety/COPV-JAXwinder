name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  physics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Fast physics test suite (closed-form verification)
        run: pytest tests -k "not shell_regression" -q
      # The full-mesh shell regression (2-5 min FEA solve) runs locally / nightly, not per-push.

  webapp-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check the webapp module script
        run: |
          python - <<'EOF'
          import re
          html = open('app/webapp/index.html', encoding='utf-8').read()
          js = re.sub(r'^import .*$', '', re.search(r'<script type="module">(.*?)</script>', html, re.S).group(1), flags=re.M)
          open('check.mjs', 'w', encoding='utf-8').write('const THREE={}; const OrbitControls=function(){};\n' + js)
          EOF
          node --check check.mjs
